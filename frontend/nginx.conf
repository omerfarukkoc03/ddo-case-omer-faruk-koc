server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Aynı köken: tarayıcı API'ye nginx üzerinden ulaşır, CORS gerekmez.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
    location = /docs          { proxy_pass http://api:8080; }
    location = /openapi.yaml  { proxy_pass http://api:8080; }
    location = /health        { proxy_pass http://api:8080; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (React Router).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
